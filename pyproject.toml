[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-mini-agent"
version = "0.1.0"
description = "A small, framework-free command-line agent with a safe workspace tool system."
requires-python = ">=3.10"

[project.scripts]
mini-agent = "mini_agent.cli:main"

[tool.setuptools.packages.find]
include = ["mini_agent*"]
